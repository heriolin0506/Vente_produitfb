<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche Produit | IMPACT - PC</title>
    <link rel="icon" type="image/jpeg" href="/images/favicon.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/images/logo.png" alt="IMPACT - PC">
                <span><span class="text-warning fw-bold">IMPACT</span> - PC</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="/boutique.html">Boutique</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact.html">Contact</a></li>
                    <li class="nav-item ms-3">
                        <a href="/admin/login.html" class="btn btn-warning btn-sm fw-bold">
                            <i class="fas fa-user-shield"></i> Admin
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Fiche Produit -->
    <section class="product-detail" style="padding-top: 130px; padding-bottom: 80px; background: #0d0d0d; min-height: 100vh;">
        <div class="container" id="produit-detail">
            <p class="text-center" style="color: #888;">Chargement du produit...</p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <h5 class="text-warning fw-bold">IMPACT - PC</h5>
            <p class="text-muted small mb-0">© 2026 IMPACT - PC | 67 HA, Antananarivo | 034 24 901 26</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const produitId = urlParams.get('id');

        if (!produitId) {
            document.getElementById('produit-detail').innerHTML = '<p class="text-center text-danger">Tsy hita ny vokatra.</p>';
        } else {
            fetch(`/api/produits/${produitId}`)
                .then(res => res.json())
                .then(p => {
                    const images = p.images && p.images.length > 0 ? p.images : [{url: 'https://via.placeholder.com/600x400'}];
                    
                    // Carrousel
                    let carouselIndicators = '';
                    let carouselItems = '';
                    images.forEach((img, index) => {
                        carouselIndicators += `<button type="button" data-bs-target="#produitCarousel" data-bs-slide-to="${index}" class="${index === 0 ? 'active' : ''}"></button>`;
                        carouselItems += `
                            <div class="carousel-item ${index === 0 ? 'active' : ''}">
                                <img src="${img.url}" class="d-block w-100" style="height: 450px; object-fit: contain; background: #1a1a1a; border-radius: 15px;" alt="${p.nom}">
                            </div>
                        `;
                    });

                    // Thumbnails
                    let thumbnails = images.map((img, index) => `
                        <img src="${img.url}" class="product-thumbnail" 
                             style="width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 2px solid ${index === 0 ? '#ff5722' : 'transparent'}; cursor: pointer; margin: 5px;"
                             onclick="changeSlide(${index})">
                    `).join('');

                    // Bouton WhatsApp sy Messenger
                    const whatsappLink = `https://wa.me/261385986522?text=Salama, te-hahafantatra bebe kokoa momba ity vokatra ity aho: ${p.nom} - ${parseInt(p.prix).toLocaleString()} Ar`;
                    const messengerLink = `https://m.me/100093998661661`;

                    document.getElementById('produit-detail').innerHTML = `
                        <nav aria-label="breadcrumb" class="mb-4">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="/" style="color: #ff5722;">Accueil</a></li>
                                <li class="breadcrumb-item"><a href="/boutique.html" style="color: #ff5722;">Boutique</a></li>
                                <li class="breadcrumb-item active" style="color: #888;">${p.nom}</li>
                            </ol>
                        </nav>

                        <div class="row g-5">
                            <!-- Sary -->
                            <div class="col-md-6">
                                <div id="produitCarousel" class="carousel slide" data-bs-ride="carousel">
                                    <div class="carousel-indicators">${carouselIndicators}</div>
                                    <div class="carousel-inner" style="border-radius: 20px; overflow: hidden;">${carouselItems}</div>
                                    <button class="carousel-control-prev" type="button" data-bs-target="#produitCarousel" data-bs-slide="prev">
                                        <span class="carousel-control-prev-icon" style="background-color: rgba(0,0,0,0.6); border-radius: 50%; padding: 22px;"></span>
                                    </button>
                                    <button class="carousel-control-next" type="button" data-bs-target="#produitCarousel" data-bs-slide="next">
                                        <span class="carousel-control-next-icon" style="background-color: rgba(0,0,0,0.6); border-radius: 50%; padding: 22px;"></span>
                                    </button>
                                </div>
                                <div class="d-flex flex-wrap mt-3 justify-content-center">${thumbnails}</div>
                            </div>

                            <!-- Mombamomba -->
                            <div class="col-md-6">
                                <span style="background: #ff5722; color: #fff; padding: 8px 18px; border-radius: 50px; font-size: 0.7rem; letter-spacing: 2px; font-weight: 700;">${p.categorie || 'Général'}</span>
                                <h1 class="fw-bold mt-3" style="color: #fff; font-size: 2.2rem;">${p.nom}</h1>
                                <p style="color: #888;"><i class="fas fa-tag"></i> ${p.marque || 'N/A'}</p>
                                <h2 class="fw-bold" style="color: #ff5722; font-size: 2.5rem;">${parseInt(p.prix).toLocaleString()} Ar</h2>
                                <p class="badge" style="background: ${p.stock > 0 ? '#25d366' : '#ff4444'}; padding: 10px 20px; font-size: 0.85rem;">En stock: ${p.stock}</p>

                                <div class="mt-4 mb-4">
                                    <a href="${whatsappLink}" target="_blank" class="btn w-100 mb-3" style="background: #25d366; color: #fff; padding: 15px; border-radius: 50px; font-weight: 700; font-size: 1rem;">
                                        <i class="fab fa-whatsapp"></i> Mifandraisa amin'ny WhatsApp
                                    </a>
                                    <a href="${messengerLink}" target="_blank" class="btn w-100" style="background: #0084ff; color: #fff; padding: 15px; border-radius: 50px; font-weight: 700; font-size: 1rem;">
                                        <i class="fab fa-facebook-messenger"></i> Mifandraisa amin'ny Messenger
                                    </a>
                                </div>

                                <hr style="border-color: #292929;">
                                <h5 class="fw-bold mt-4" style="color: #ff5722;"><i class="fas fa-info-circle"></i> Description</h5>
                                <p style="color: #aaa; line-height: 1.7;">${p.description || 'Tsy misy description.'}</p>
                                
                                <h5 class="fw-bold mt-4" style="color: #ff5722;"><i class="fas fa-cogs"></i> Spécifications</h5>
                                <p style="color: #aaa; line-height: 1.7;">${p.specs || 'Tsy misy specs.'}</p>
                            </div>
                        </div>
                    `;

                    window.changeSlide = function(index) {
                        const carousel = document.querySelector('#produitCarousel');
                        const bsCarousel = bootstrap.Carousel.getInstance(carousel) || new bootstrap.Carousel(carousel);
                        bsCarousel.to(index);
                        
                        document.querySelectorAll('.product-thumbnail').forEach((t, i) => {
                            t.style.border = i === index ? '2px solid #ff5722' : '2px solid transparent';
                        });
                    };
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('produit-detail').innerHTML = '<p class="text-center text-danger">Nisy olana tamin\'ny fakana ny vokatra.</p>';
                });
        }
    </script>
</body>
</html>
