<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres | IMPACT - PC</title>
    <link rel="icon" type="image/jpeg" href="/images/favicon.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="admin-sidebar" style="width: 260px;">
            <h4><span>IMPACT</span> - PC</h4>
            <hr>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="/admin/dashboard.html">
                        <i class="fas fa-tachometer-alt"></i> Tableau de bord
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/produits.html">
                        <i class="fas fa-box"></i> Produits
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/admin/parametres.html">
                        <i class="fas fa-cog"></i> Paramètres
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Déconnexion
                    </a>
                </li>
            </ul>
        </div>

        <!-- Contenu -->
        <div class="flex-grow-1 admin-content">
            <h2 class="admin-title">Paramètres</h2>
            <p class="admin-subtitle">Hanova ny mot de passe</p>

            <div class="row">
                <div class="col-md-6">
                    <div style="background: #1a1a1a; border: 1px solid #292929; border-radius: 20px; padding: 30px;">
                        <h5 style="color: #ff5722; font-weight: 700; margin-bottom: 25px;">
                            <i class="fas fa-key"></i> Changer le mot de passe
                        </h5>

                        <form id="passwordForm">
                            <!-- Mot de passe actuel -->
                            <div class="mb-3">
                                <label style="color: #ccc; font-size: 0.9rem;">Mot de passe actuel</label>
                                <div style="position: relative;">
                                    <input type="password" class="form-control" id="oldPassword" required 
                                           style="background: #101010; border: 1px solid #303030; color: #fff; padding: 12px; padding-right: 45px;">
                                    <span onclick="togglePassword('oldPassword', 'eyeOld')" 
                                          style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888;">
                                        <i class="fas fa-eye" id="eyeOld"></i>
                                    </span>
                                </div>
                            </div>

                            <!-- Nouveau mot de passe -->
                            <div class="mb-3">
                                <label style="color: #ccc; font-size: 0.9rem;">Nouveau mot de passe</label>
                                <div style="position: relative;">
                                    <input type="password" class="form-control" id="newPassword" required 
                                           style="background: #101010; border: 1px solid #303030; color: #fff; padding: 12px; padding-right: 45px;">
                                    <span onclick="togglePassword('newPassword', 'eyeNew')" 
                                          style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888;">
                                        <i class="fas fa-eye" id="eyeNew"></i>
                                    </span>
                                </div>
                            </div>

                            <!-- Confirmation -->
                            <div class="mb-3">
                                <label style="color: #ccc; font-size: 0.9rem;">Confirmer le nouveau mot de passe</label>
                                <div style="position: relative;">
                                    <input type="password" class="form-control" id="confirmPassword" required 
                                           style="background: #101010; border: 1px solid #303030; color: #fff; padding: 12px; padding-right: 45px;">
                                    <span onclick="togglePassword('confirmPassword', 'eyeConfirm')" 
                                          style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888;">
                                        <i class="fas fa-eye" id="eyeConfirm"></i>
                                    </span>
                                </div>
                            </div>

                            <button type="submit" class="btn-admin-primary w-100">
                                <i class="fas fa-save"></i> Enregistrer
                            </button>
                        </form>

                        <div id="message" class="mt-3 text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/admin/login.html';

        // --- HAMPISEHO/MANAFINA NY MOT DE PASSE ---
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // --- FANOVANA NY MOT DE PASSE ---
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('message');

            if (newPassword !== confirmPassword) {
                message.innerHTML = '<span style="color: #ff4444;">Tsy mitovy ny mot de passe vaovao!</span>';
                return;
            }

            if (newPassword.length < 6) {
                message.innerHTML = '<span style="color: #ff4444;">Tokony 6 litera farafahakeliny ny mot de passe!</span>';
                return;
            }

            try {
                const res = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ oldPassword, newPassword })
                });
                const data = await res.json();
                
                if (res.ok) {
                    message.innerHTML = '<span style="color: #25d366;">✅ Vita soa aman-tsara ny fanovana!</span>';
                    document.getElementById('passwordForm').reset();
                } else {
                    message.innerHTML = `<span style="color: #ff4444;">❌ ${data.message}</span>`;
                }
            } catch (err) {
                message.innerHTML = '<span style="color: #ff4444;">Nisy olana tamin\'ny fifandraisana.</span>';
            }
        });

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/admin/login.html';
        }
    </script>
</body>
</html>
