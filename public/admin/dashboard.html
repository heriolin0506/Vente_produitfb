<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord | IMPACT - PC</title>
    <link rel="icon" type="image/jpeg" href="/images/favicon.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: #0d0d0d;">

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="admin-sidebar" style="width: 250px;">
            <h4 class="fw-bold mb-4"><span style="color: #ff5722;">IMPACT</span> - PC</h4>
            <hr style="border-color: #333;">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" href="/admin/dashboard.html"><i class="fas fa-tachometer-alt"></i> Tableau de bord</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/produits.html"><i class="fas fa-box"></i> Produits</a></li>
                            <li class="nav-item">
    <a class="nav-link" href="/admin/parametres.html">
        <i class="fas fa-cog"></i> Paramètres
    </a>
</li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
                
            </ul>

        </div>

        <!-- Contenu -->
        <div class="flex-grow-1 p-4">
            <h2 class="fw-bold mb-4" style="color: #fff;">Tableau de bord</h2>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="p-4" style="background: #1a1a1a; border-radius: 20px; border: 1px solid #292929;">
                        <h5 style="color: #ff5722;">Total Produits</h5>
                        <h2 id="totalProduits" style="color: #fff; font-size: 2.5rem; font-weight: 800;">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="p-4" style="background: #1a1a1a; border-radius: 20px; border: 1px solid #292929;">
                        <h5 style="color: #25d366;">Nouveaux Produits</h5>
                        <h2 id="nouveauxProduits" style="color: #fff; font-size: 2.5rem; font-weight: 800;">0</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/admin/login.html';

        fetch('/api/produits')
            .then(res => res.json())
            .then(data => {
                document.getElementById('totalProduits').innerText = data.length;
                document.getElementById('nouveauxProduits').innerText = Math.min(data.length, 5);
            });

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/admin/login.html';
        }
    </script>
</body>
</html>
