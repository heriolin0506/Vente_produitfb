<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | IMPACT - PC</title>
    <link rel="icon" type="image/jpeg" href="/images/favicon.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: #0d0d0d; min-height: 100vh; display: flex; align-items: center;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg" style="background: #1a1a1a; border: 1px solid #292929; border-radius: 20px;">
                    <div class="card-header text-center fw-bold" style="background: #ff5722; color: #fff; border-radius: 20px 20px 0 0; padding: 20px;">
                        <i class="fas fa-lock"></i> Espace Admin
                    </div>
                    <div class="card-body p-4">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label" style="color: #ccc;">Email</label>
                                <input type="email" class="form-control" id="email" required style="background: #101010; border: 1px solid #303030; color: #fff; padding: 12px;">
                            </div>
                            <div class="mb-3">
    <label for="password" class="form-label" style="color: #ccc;">Mot de passe</label>
    <div style="position: relative;">
        <input type="password" class="form-control" id="password" required 
               style="background: #101010; border: 1px solid #303030; color: #fff; padding: 12px; padding-right: 45px;">
        <span onclick="togglePassword()" 
              style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888;">
            <i class="fas fa-eye" id="eyeIcon"></i>
        </span>
    </div>
</div>
                            <button type="submit" class="btn w-100 fw-bold" style="background: #ff5722; color: #fff; padding: 12px; border-radius: 50px;">Se connecter</button>
                        </form>
                        <div id="loginMessage" class="mt-3 text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('loginMessage');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/admin/dashboard.html';
                } else {
                    message.innerHTML = `<span class="text-danger">${data.message}</span>`;
                }
            } catch (err) {
                message.innerHTML = `<span class="text-danger">Nisy olana tamin'ny fifandraisana.</span>`;
            }
        });
        // --- HAMPISEHO/MANAFINA NY MOT DE PASSE ---
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
    }
}
    </script>
</body>
</html>
